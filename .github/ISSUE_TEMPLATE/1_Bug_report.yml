name: Bug report
description: Report a bug in Sage Sail
body:
  - type: input
    attributes:
      label: Sage Sail version
    validations:
      required: true
  - type: input
    attributes:
      label: PHP version
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: "macOS, Linux, or Windows (WSL2)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Describe what happened and what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
