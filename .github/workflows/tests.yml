name: Docker Compose Test

on:
  push:
    branches:
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: 'sage-sail'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Create a new Bedrock application
        run: composer create-project roots/bedrock app --no-interaction --prefer-dist

      - name: Link the Sage Sail repository
        run: |
          composer config minimum-stability dev
          composer config repositories.sage-sail path ../sage-sail
          composer require jeffersonrucu/sage-sail:* --dev -W --no-interaction
        working-directory: app

      - name: Install Sage Sail into the application
        run: |
          ./vendor/bin/sage-sail install --php=${{ matrix.php }} --no-interaction
          ./vendor/bin/sage-sail publish --no-interaction
        working-directory: app

      - name: Validate the generated compose file
        run: WWWUSER=1000 WWWGROUP=1000 docker compose config --quiet
        working-directory: app
