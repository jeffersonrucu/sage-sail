; Replaces the distribution's default pool so nothing is inherited implicitly.
[www]
user = sage
group = sage

listen = /run/php/php8.3-fpm.sock
listen.owner = sage
listen.group = sage
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Surface worker output through the container logs...
catch_workers_output = yes
decorate_workers_output = no

; Xdebug and the application read variables passed in by Compose...
clear_env = no
